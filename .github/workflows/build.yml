name: Build iOS IPA
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install app dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install matching flet-cli build tool
        run: pip install flet-cli==0.28.3

      - name: Show repo structure
        run: ls -la

      - name: Build unsigned archive
        run: echo "y" | flet build ipa . --module-name main

      - name: Show build output structure
        run: find build -maxdepth 4

      - name: Package unsigned IPA from archive
        run: |
          set -e
          ARCHIVE_APP=$(find build -name "*.app" -path "*Products/Applications*" | head -n 1)
          if [ -z "$ARCHIVE_APP" ]; then
            echo "Не найден .app внутри архива — смотри вывод предыдущего шага 'Show build output structure'"
            exit 1
          fi
          echo "Found app: $ARCHIVE_APP"
          mkdir -p ipa_out/Payload
          cp -R "$ARCHIVE_APP" ipa_out/Payload/
          cd ipa_out
          zip -qr ../MorningApp-unsigned.ipa Payload
          cd ..
          ls -lh MorningApp-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: MorningApp-IPA
          path: MorningApp-unsigned.ipa
